<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Search Movie</title>
  </head>
  <body>
    <h1 class="title" id="logo">Search <span class="accent">Movies</span></h1>
    <header>
      <form action="">
        <div class="InputForResearch">
          <input type="text"  placeholder="Name Movies?" id="Input" required />
          <div>
            <button type="submit" id="btn">Search</button>
          </div>
        </div>
      </form>
    </header>

    <section id="researchMovie">
        <div id="Movie">

        </div>
    </section>



    <div id="movieModal" class="modal">
      <div class="modal-content">
          <span class="close-modal">&times;</span>
          
          <div id="modalDetails">
              </div>
      </div>
  </div>



  <button id="loadMore">Показать еще</button>



    <script  type="module" src="./src/main.js"></script>
  </body>
</html>
